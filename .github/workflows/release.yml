name: release

# Push a tag like v1.1.0 to publish a pinned release. Users then install exactly that
# version with:  npx skills add appuk45/claude-codebase-audit@v1.1.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match every version string
        working-directory: codebase-audit
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PLUGIN=$(python -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          ENGINE=$(python -c "import sys;sys.path.insert(0,'skills/codebase-audit/scripts');import engine;print(engine.__version__)")
          echo "tag=$TAG plugin=$PLUGIN engine=$ENGINE"
          test "$TAG" = "$PLUGIN" && test "$TAG" = "$ENGINE"
      - name: Test
        working-directory: codebase-audit
        run: |
          pip install -r requirements-dev.txt
          python -m tools.sync_skills --check
          python -m pytest tests -q
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "codebase-audit $GITHUB_REF_NAME"
